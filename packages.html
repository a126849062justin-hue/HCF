<style>
.pk-sec{padding:40px 0 80px}
.pk-sec .wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:900px){.pk-grid{grid-template-columns:1fr;max-width:460px;margin:0 auto}}
.pk{border:1px solid var(--line,#E5E5E5);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 16px 40px rgba(17,17,17,.08);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.pk:hover{transform:translateY(-4px);box-shadow:0 24px 54px rgba(17,17,17,.14)}
.pk .imgw{position:relative;cursor:zoom-in;line-height:0}
.pk img{width:100%;display:block}
.pk .zoom{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;font-family:var(--en);letter-spacing:.08em;padding:4px 9px;border-radius:20px}
.pk .cta{display:block;text-align:center;background:var(--red);color:#fff;font-weight:900;letter-spacing:.04em;padding:16px;text-decoration:none;transition:.2s}
.pk .cta:hover{background:var(--redD,#9B0B0F)}
.pk-note{text-align:center;color:var(--ink3,#8A8A8A);font-size:.82rem;margin-top:22px;line-height:1.8}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lb .x{position:absolute;top:18px;right:22px;color:#fff;font-family:var(--en);font-size:1.4rem;cursor:pointer}
</style>

<div class="seamA">

<section class="pk-sec">
  <div class="wrap">

      </div>

      <div class="pk">
        <div class="imgw" data-full="pack_upgrade.jpg"><img src="pack_upgrade.jpg" alt="HCF 團課升級包 Upgrade Pack — 私教5＋團課10，套組 12,800"><span class="zoom">🔍 點圖放大</span></div>
        <a class="cta" href="https://lin.ee/7lidUv0" target="_blank" rel="noopener">團課升級包・LINE 諮詢</a>
      </div>

      <div class="pk">
        <div class="imgw" data-full="pack_shred.jpg"><img src="pack_shred.jpg" alt="HCF 減脂衝刺包 Shred Pack — 私教10＋打靶10＋團課包月1個月，套組 27,800"><span class="zoom">🔍 點圖放大</span></div>

  </div>

<div class="seamC"><div class="wedge dot"></div></div>
<section class="finale" id="finale"></section>

<div class="lb" id="lb"><span class="x">✕ 關閉</span><img id="lbimg" src="" alt="套組方案放大"></div>

<script src="hcf.js"></script>
<script>
(function(){
  var lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
  document.querySelectorAll('.imgw').forEach(function(w){
    w.addEventListener('click',function(){lbimg.src=w.dataset.full;lb.classList.add('on');
      if(window.hcfTrack)hcfTrack('package_view',{pack:w.dataset.full});});
  });
  lb.addEventListener('click',function(){lb.classList.remove('on');lbimg.src='';});
  document.querySelectorAll('.pk .cta').forEach(function(a){
    a.addEventListener('click',function(){if(window.hcfTrack)hcfTrack('package_line',{label:(a.textContent||'').trim()});});
  });
})();
</script>
<script src="hcf-analytics.js" defer></script>
